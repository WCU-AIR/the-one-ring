x-cluster: &cluster
  image: spark-master:4.2.0
  volumes:
    - ./apps:/opt/spark-apps
    - ./data:/opt/spark-data

services:
  spark-master:
    <<: *cluster
    build: ./docker
    hostname: spark-master
    container_name: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT:-9090}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${JUPYTER_PORT:-8888}:8888"
      - "${SPARK_APP_UI_PORT:-4040}:4040"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_LOCAL_IP: spark-master
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1G}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1G}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://spark-master:8080 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-worker:
    <<: *cluster
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark-cluster/start.sh", "worker"]
    ports:
      - "8081"
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1G}
    deploy:
      resources:
        limits:
          cpus: "${SPARK_WORKER_CPU_LIMIT:-1.0}"
          memory: ${SPARK_WORKER_MEM_LIMIT:-1G}

networks:
  default:
    name: spark-network
